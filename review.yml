actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and Homethrive exposes no public or
    partner developer API of any kind. Homethrive is documented in this catalog
    as an honest stub: a B2B2C caregiving-support benefit whose only technical
    connectivity (eligibility files and SSO) is arranged privately during
    enterprise onboarding. No AsyncAPI or OpenAPI document was created because
    there is no documented public API surface to model, and no endpoints were
    modeled or fabricated.
