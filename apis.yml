name: Homethrive
kind: company
description: Homethrive is a technology-enabled caregiving-support benefit sold to
  employers, health plans, financial institutions, ancillary insurers, brokers, and
  platform partners. It pairs a digital assistant (Homethrive Dari) with human Care
  Guides to help family caregivers navigate backup care, aging, complex health,
  estate planning, and loss for their loved ones. Homethrive is a B2B2C member
  platform - it is delivered to covered members through their employer or health
  plan, not as a self-serve product. There is no public or partner developer API,
  API reference, or developer portal. Customer integration is handled during
  enterprise onboarding via an eligibility-file specification (typically SFTP/CSV
  batch files) and Single Sign-On (SSO), with utilization and engagement data
  returned to the sponsor - all arranged through implementation, not a documented
  self-service API.
